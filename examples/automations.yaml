# Bundled sample only. Site YAML belongs in the git you set as automationsDir,
# not in this plugin.

helpers:
  dish_manual:
    type: boolean
    name: Dish manual
    default: false
    on_start: restore
    latch_on_external_put: electrical.switches.dish.state
  trip_prep:
    type: boolean
    name: Prepare to leave
    default: false
    on_start: restore

automations:
  - id: shore_charge
    alias: Shore charge
    zones:
      home_harbour:
        name: Home harbour
        lat: 52.1
        lon: 4.9
        radius: 150
    trigger:
      - path: sensors.presence.shore
      - path: electrical.batteries.house.capacity.stateOfCharge
        round: 0.01
      - helper: trip_prep
    choose:
      - alias: charge underway
        conditions:
          - path: sensors.presence.shore
            is: true
          - not:
              zone: home_harbour
        action:
          - put: electrical.switches.charger.state
            value: 1
      - alias: charge to leave
        conditions:
          - path: sensors.presence.shore
            is: true
          - zone: home_harbour
          - helper: trip_prep
            is: true
          - path: electrical.batteries.house.capacity.stateOfCharge
            below: 0.98
        action:
          - put: electrical.switches.charger.state
            value: 1
      - alias: leave charged
        conditions:
          - path: sensors.presence.shore
            is: true
          - zone: home_harbour
          - helper: trip_prep
            is: true
          - path: electrical.batteries.house.capacity.stateOfCharge
            above: 0.97
        action:
          - put: electrical.switches.charger.state
            value: 0
          - helper: trip_prep
            value: false
      - alias: home below 60%
        conditions:
          - path: sensors.presence.shore
            is: true
          - zone: home_harbour
          - helper: trip_prep
            is: false
          - path: electrical.batteries.house.capacity.stateOfCharge
            below: 0.6
        action:
          - put: electrical.switches.charger.state
            value: 1
      - alias: home above 80%
        conditions:
          - path: sensors.presence.shore
            is: true
          - zone: home_harbour
          - helper: trip_prep
            is: false
          - path: electrical.batteries.house.capacity.stateOfCharge
            above: 0.8
        action:
          - put: electrical.switches.charger.state
            value: 0

  - id: dish_standby
    alias: Dish standby update
    trigger:
      - schedule: "0 4 * * *"
    condition:
      - zone: home_harbour
      - helper: dish_manual
        is: false
    action:
      - put: electrical.switches.dish.state
        value: true
      - delay: 15m
      - put: electrical.switches.dish.state
        value: false
