helpers:
  starlink_manual:
    type: boolean
    name: Starlink handmatig
    default: false
    on_start: restore
    latch_on_external_put: electrical.switches.starlink.state
  depart_prep:
    type: boolean
    name: Maak klaar voor vertrek
    default: false
    on_start: restore

automations:
  - id: shore_charge
    alias: Walstroom laadbeleid
    zones:
      home_harbour:
        name: Thuishaven
        lat: 52.37
        lon: 5.22
        radius: 150
    trigger:
      - path: sensors.presence.dolphinshelly
      - path: electrical.batteries.house.capacity.stateOfCharge
        round: 0.01
      - helper: depart_prep
    choose:
      - alias: onderweg volladen
        conditions:
          - path: sensors.presence.dolphinshelly
            is: true
          - not:
              zone: home_harbour
        action:
          - put: electrical.switches.dolphinCharger.state
            value: 1
      - alias: klaar voor vertrek laden
        conditions:
          - path: sensors.presence.dolphinshelly
            is: true
          - zone: home_harbour
          - helper: depart_prep
            is: true
          - path: electrical.batteries.house.capacity.stateOfCharge
            below: 0.98
        action:
          - put: electrical.switches.dolphinCharger.state
            value: 1
      - alias: klaar voor vertrek vol
        conditions:
          - path: sensors.presence.dolphinshelly
            is: true
          - zone: home_harbour
          - helper: depart_prep
            is: true
          - path: electrical.batteries.house.capacity.stateOfCharge
            above: 0.97
        action:
          - put: electrical.switches.dolphinCharger.state
            value: 0
          - helper: depart_prep
            value: false
      - alias: thuis onder 60%
        conditions:
          - path: sensors.presence.dolphinshelly
            is: true
          - zone: home_harbour
          - helper: depart_prep
            is: false
          - path: electrical.batteries.house.capacity.stateOfCharge
            below: 0.6
        action:
          - put: electrical.switches.dolphinCharger.state
            value: 1
      - alias: thuis boven 80%
        conditions:
          - path: sensors.presence.dolphinshelly
            is: true
          - zone: home_harbour
          - helper: depart_prep
            is: false
          - path: electrical.batteries.house.capacity.stateOfCharge
            above: 0.8
        action:
          - put: electrical.switches.dolphinCharger.state
            value: 0

  - id: starlink_standby
    alias: Starlink standby-update
    trigger:
      - schedule: "0 4 * * *"
    condition:
      # home_harbour is defined on shore_charge (Walstroom laadbeleid).
      - zone: home_harbour
      - helper: starlink_manual
        is: false
    action:
      - put: electrical.switches.starlink.state
        value: true
      - delay: 15m
      - put: electrical.switches.starlink.state
        value: false
